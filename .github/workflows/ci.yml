name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the suite
        run: pytest

  dashboard:
    name: Dashboard bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The committed bundle matches its sources
        run: node scripts/build_dashboard.mjs --check
      - name: The bundle parses
        run: node --check dashboard/dist/index.js

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e.sh

  plugin:
    name: Hermes plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: morph
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes
        run: pip install hermes-agent
      - name: Plugin doctor
        working-directory: morph
        run: hermes plugins doctor . --ci
      - name: Plugin validate
        working-directory: morph
        run: hermes plugins validate .
