# MORPH ships no Python dependencies of its own.
#
# Everything it imports at runtime — fastapi, pydantic, httpx — is already part of
# Hermes, which is deliberate: a plugin that drags its own versions of the host's
# own stack is a plugin that breaks on the host's next release. The dev extra
# exists only for running the tests outside a Hermes checkout.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-hermes"
version = "1.0.0"
description = "Adaptive, action-capable workspaces composed from the applications Hermes is connected to."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyyaml>=6,<7",
  "httpx>=0.27,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pytest_asyncio.*",
  "ignore:.*starlette.testclient.*:UserWarning",
]
markers = [
  "slow: tests that start real subprocesses",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
