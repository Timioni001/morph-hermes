name: morph
label: MORPH
version: 1.0.0
description: >-
  One adaptive workspace across the applications you use, with human-approved,
  verified actions: an approval gate between the agent and the APIs it can write to. MORPH connects to a
  GitHub repository or any service with an OpenAPI document, learns from the schema what
  can be read and what can be safely changed, and gives the agent tools to read and to
  propose. Writes are two-step: the agent may only propose, a human approves in the
  dashboard seeing the exact before and after, and every applied change is verified by
  re-reading the record from the API. Everything is kept in a hash-chained audit log.
author: MORPH contributors
license: MIT
homepage: https://github.com/timioni001/morph-hermes
manifest_version: 2
requires_hermes: ">=0.19"
tags:
  - approvals
  - human-in-the-loop
  - integrations
  - github
  - dashboard
provides_tools:
  - morph_discover
  - morph_plan_workspace
  - morph_workspace_state
  - morph_refresh
  - morph_inspect_record
  - morph_propose_action
  - morph_verify_action
provides_hooks:
  - on_session_start
  - pre_tool_call
  - post_tool_call
provides_middleware: []
requires_env: []
config_keys:
  - morph.config
config_schema:
  config:
    type: object
    description: >-
      MORPH's connections, cross-service links and roles. Same shape as
      config/connectors.sandbox.json. Omit it and manage connections with
      `hermes morph connect`, which writes <plugin data dir>/config.json.
