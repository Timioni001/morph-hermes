name: morph
label: MORPH
version: 1.0.0
description: >-
  One adaptive workspace over several independent applications, with human-approved
  cross-application actions. MORPH introspects each connected application's schema
  over HTTP, builds a capability graph, interprets a goal stated in plain language,
  plans a validated declarative interface, resolves it against live data and joins
  records across application boundaries. Writes are two-step: the agent may only
  propose, a human approves in the dashboard, and every applied action is verified by
  re-reading the record from the source application.
author: MORPH contributors
license: MIT
homepage: https://github.com/timioni001/morph-hermes
manifest_version: 2
requires_hermes: ">=0.19"
tags:
  - generative-ui
  - integrations
  - operations
  - dashboard
provides_tools:
  - morph_discover
  - morph_plan_workspace
  - morph_workspace_state
  - morph_refresh
  - morph_inspect_record
  - morph_propose_action
  - morph_verify_action
provides_hooks:
  - on_session_start
  - pre_tool_call
  - post_tool_call
provides_middleware: []
requires_env: []
config_keys:
  - morph.config
config_schema:
  config:
    type: object
    description: >-
      MORPH's connector wiring, cross-application links and roles. Same shape as
      config/connectors.default.json. Omit it to use
      <plugin data dir>/config.json, MORPH_CONFIG_FILE, or the bundled default.
